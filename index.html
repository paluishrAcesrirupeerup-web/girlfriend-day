<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Someone Special ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- Premium fonts -->
   <link href="https://fonts.googleapis.com/css2?family=Allura&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>


<body>


    <!-- Background effects -->
    <div id="particles"></div>
    <div id="sakura"></div>
    <div id="hearts"></div>



    <!-- Main App -->

    <main id="app">


        <div class="glass-card">


            <!-- Dynamic title -->

            <h1 id="title">
                For Someone Special ❤️
            </h1>



            <!-- Dynamic text -->

            <p id="message">

                I made something just for you...

            </p>



            <!-- Dynamic buttons -->

            <div id="buttons">

                <button class="liquid-btn" id="startBtn">

                    Start ❤️

                </button>

            </div>




            <!-- Gallery -->

            <div id="gallery" class="gallery">

            </div>



            <!-- Final handwriting area -->

            <div id="finalScene">


                <svg id="loveSVG"
                     viewBox="0 0 500 200"
                     xmlns="http://www.w3.org/2000/svg">


                    <!-- JS will insert handwriting paths here -->


                </svg>


                <h2 id="finalText">

                </h2>


            </div>


        </div>


    </main>





    <!-- Music -->

    <audio id="music" loop preload="auto">
           loop>

        <source src="assets/music/bg.mp3" type="audio/mp3">

    </audio>




    <script src="script.js"></script>


</body>

</html>
